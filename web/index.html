  <style>
    /* Instant loading screen: shown by the HTML itself while the app
       (about 3–4 MB) downloads, so slow connections never see a blank page. */
    html, body { margin: 0; background: #F6F8FA; }
    #ah-splash { position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px; color: #0F172A;
      background: #F6F8FA; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity .35s ease; z-index: 9999; }
    #ah-splash .ah-name { font-size: 20px; font-weight: 800; letter-spacing: .2px; }
    #ah-splash .ah-bar { width: 160px; height: 4px; border-radius: 4px; background: #E2E8F0; overflow: hidden; }
    #ah-splash .ah-bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 4px;
      background: #00A859; animation: ah-load 1.2s ease-in-out infinite; }
    #ah-splash .ah-msg { font-size: 13px; color: #64748B; min-height: 18px; }
    @keyframes ah-load { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    @media (prefers-color-scheme: dark) {
      html, body, #ah-splash { background: #0B1220; }
      #ah-splash { color: #F8FAFC; }
      #ah-splash .ah-bar { background: #334155; }
      #ah-splash .ah-msg { color: #94A3B8; }
    }
  </style>

  <style>
    flt-platform-view,
    flt-platform-view-slot,
    flt-platform-view iframe {
      width: 100% !important;
      height: 100% !important;
    }

    flt-platform-view video,
    video {
      display: block !important;
      width: 100% !important;
      height: 100% !important;
      min-width: 1px !important;
      min-height: 1px !important;
      object-fit: cover !important;
      opacity: 1 !important;
      visibility: visible !important;
      background: transparent !important;
    }
  </style>
  <script>
    (function () {
      function patchCameraVideo(video) {
        if (!video || video.dataset.academyhubCameraPatched === 'true') return;

        video.dataset.academyhubCameraPatched = 'true';
        video.setAttribute('autoplay', 'true');
        video.setAttribute('muted', 'true');
        video.setAttribute('playsinline', 'true');
        video.setAttribute('webkit-playsinline', 'true');
        video.autoplay = true;
        video.muted = true;
        video.defaultMuted = true;
        video.controls = false;

        video.style.display = 'block';
        video.style.width = '100%';
        video.style.height = '100%';
        video.style.minWidth = '1px';
        video.style.minHeight = '1px';
        video.style.objectFit = 'cover';
        video.style.opacity = '1';
        video.style.visibility = 'visible';
        video.style.background = 'transparent';

        video.addEventListener('loadedmetadata', function () {
          console.log(
            '[AcademyHubCameraPatch] loadedmetadata',
            video.videoWidth,
            video.videoHeight,
            video.readyState
          );
          var playResult = video.play();
          if (playResult && playResult.catch) {
            playResult.catch(function (error) {
              console.warn('[AcademyHubCameraPatch] video.play falhou', error);
            });
          }
        });

        video.addEventListener('canplay', function () {
          console.log(
            '[AcademyHubCameraPatch] canplay',
            video.videoWidth,
            video.videoHeight,
            video.readyState
          );
        });
      }

      function patchAllVideos() {
        document.querySelectorAll('video').forEach(patchCameraVideo);
      }

      window.addEventListener('DOMContentLoaded', patchAllVideos);
      new MutationObserver(function (mutations) {
        for (var i = 0; i < mutations.length; i++) {
          var added = mutations[i].addedNodes;
          for (var j = 0; j < added.length; j++) {
            var node = added[j];
            if (node.nodeName === 'VIDEO' ||
                (node.querySelector && node.querySelector('video'))) {
              patchAllVideos();
              return;
            }
          }
        }
      }).observe(document.documentElement, {
        childList: true,
        subtree: true
      });
    })();
  </script>

  <script>
    (function () {
      var splash = document.getElementById('ah-splash');
      var msg = document.getElementById('ah-splash-msg');
      var slow = setTimeout(function () {
        if (msg) msg.textContent = 'Conexão lenta, quase lá…';
      }, 7000);
      window.addEventListener('flutter-first-frame', function () {
        clearTimeout(slow);
        if (!splash) return;
        splash.style.opacity = '0';
        setTimeout(function () { splash.remove(); }, 400);
      });
    })();
  </script>
